---
layout: default
title: Blog.html
---
<ul>
{% for post in site.posts %}
    {% if post.hidden != "true" %}
        <li><a href="{{ post.url }}" title="{{ post.title }}"><img src="/assets/img/file.ico" title="{{ post.title }}" />{{ post.title }} - {{ post.desc }}</a></li>
    {% endif %}
{% endfor %}
</ul>
